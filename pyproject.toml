[project]
name = "llm-evals-starter"
version = "0.1.0"
description = "Open-source harness for stress-testing AI agents with simulated users and LLM-as-a-judge evaluation, built on DeepEval"
authors = [
    {name = "Manos", email = "your-email@example.com"}
]
readme = "README.md"
requires-python = ">=3.9,<4.0"
license = {text = "MIT"}
keywords = ["llm", "evaluation", "deepeval", "ai-agent", "testing", "simulation"]

dependencies = [
    "deepeval>=3.0.0",
    "pyyaml>=6.0",
    "typer>=0.9.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",  # For beautiful CLI output
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
service = [
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
]

[project.scripts]
llm-evals-starter = "src.cli:app"

[tool.setuptools]
packages = ["src", "examples"]

[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']

[tool.ruff]
line-length = 100
target-version = "py39"
